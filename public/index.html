<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri-Direct | Quick Mobile Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md p-8">
    
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-800 text-3xl font-extrabold rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm border border-emerald-200">
        🌱
      </div>
      <h2 class="text-2xl font-extrabold text-slate-800">Agri-Direct</h2>
      <p class="text-slate-500 text-xs mt-1">Directly Connecting Farmers & Buyers</p>
    </div>

    <!-- Direct Login Form (OTP विरहित) -->
    <form onsubmit="handleDirectLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Mobile Number / मोबाईल नंबर</label>
        <div class="flex gap-2">
          <span class="bg-slate-100 text-slate-600 font-bold px-3 py-2.5 rounded-xl border border-slate-300 text-sm flex items-center shrink-0">
            🇮🇳 +91
          </span>
          <input type="tel" id="mobileInput" placeholder="Enter 10-digit mobile number" maxlength="10" pattern="[0-9]{10}" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-semibold text-slate-800 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Your Full Name / पूर्ण नाव</label>
        <input type="text" id="nameInput" placeholder="Enter your full name" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email ID / ईमेल आयडी</label>
        <input type="email" id="emailInput" placeholder="example@gmail.com" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold">
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition shadow-md text-sm mt-2 flex items-center justify-center gap-2">
        Login / लॉगिन करा 🚀
      </button>
    </form>

  </div>

  <script>
    // जर युझर आधीच लॉगिन असेल तर थेट डॅशबोर्डवर पाठवा
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    async function handleDirectLogin(e) {
      e.preventDefault();

      const phone = document.getElementById('mobileInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();

      if (!phone || phone.length !== 10) {
        alert('कृपया १० अंकी वैध मोबाईल नंबर टाका!');
        return;
      }

      if (!name) {
        alert('कृपया तुमचे नाव टाका!');
        return;
      }

      try {
        // 1. बॅकएंड API कॉल (जर बॅकएंड चालू असेल तर)
        const res = await fetch('/api/auth/mobile-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
        } else {
          // बॅकएंड उपलब्ध नसल्यास फॉलबॅक (Offline/Demo support)
          saveFallbackUser(phone, name, email);
        }
      } catch (err) {
        // नेटवर्क एरर आल्यास फॉलबॅक लोकल टोकन आणि डेटा सेव्ह करा
        saveFallbackUser(phone, name, email);
      }

      alert('🎉 Login Successful!');
      window.location.href = 'dashboard.html';
    }

    function saveFallbackUser(phone, name, email) {
      const existingUser = JSON.parse(localStorage.getItem('user') || '{}');
      const dummyUser = { 
        id: 'user_' + phone, 
        name: name, 
        phone: phone, 
        email: email, 
        role: 'FARMER',
        ...existingUser // जुना इतर प्रोफाईल डेटा असल्यास टिकवून ठेवण्यासाठी
      };
      
      localStorage.setItem('token', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_token_' + Date.now());
      localStorage.setItem('user', JSON.stringify(dummyUser));
    }
  </script>
</body>
</html>
