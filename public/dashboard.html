<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri-Direct | Fresh Agri Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-700/50 p-2.5 rounded-2xl border border-emerald-600/40">
          🌱
        </div>
        <div>
          <span class="text-2xl font-extrabold tracking-tight text-emerald-100">Agri-Direct</span>
          <p class="text-[10px] text-emerald-300 font-medium">Direct Farmer to Buyer Marketplace</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="my-crops.html" class="bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 border border-emerald-700 font-semibold px-4 py-2.5 rounded-xl text-xs transition">
          👨‍🌾 My Profile
        </a>
        <a href="orders.html" class="bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 border border-emerald-700 font-semibold px-4 py-2.5 rounded-xl text-xs transition">
          📦 Orders
        </a>
        <a href="add-crop.html" class="bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold px-4 py-2.5 rounded-xl text-xs shadow-lg shadow-emerald-950/20 transition">
          ✨ + Add Crop
        </a>
        <button onclick="logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-200 border border-red-500/30 font-bold px-3.5 py-2.5 rounded-xl text-xs transition">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <div class="relative bg-emerald-950 text-white overflow-hidden">
    <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=1600&q=80" class="absolute inset-0 w-full h-full object-cover opacity-20">
    <div class="relative max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8 text-center sm:text-left flex flex-col justify-between items-center gap-6">
      <div class="w-full">
        <span class="bg-emerald-800/80 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-700/50 uppercase tracking-wider">
          🌾 Direct Farmer Deals
        </span>
        <h1 class="text-3xl sm:text-4xl font-extrabold mt-3 text-white leading-tight">
          Explore Fresh Farm Produce
        </h1>
        
        <!-- Search & Filter Controls -->
        <div class="mt-6 flex flex-col sm:flex-row gap-3 max-w-3xl">
          <input type="text" id="searchInput" oninput="filterProducts()" placeholder="🔍 Search crop (e.g. Tomato, Soyabean)..." class="flex-1 bg-white/95 text-slate-800 px-4 py-3 rounded-2xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-lg">
          <select id="districtFilter" onchange="filterProducts()" class="bg-white/95 text-slate-800 px-4 py-3 rounded-2xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-lg">
            <option value="">📍 All Districts</option>
            <option value="Nanded">Nanded</option>
            <option value="Nashik">Nashik</option>
            <option value="Yavatmal">Yavatmal</option>
            <option value="Sangli">Sangli</option>
            <option value="Latur">Latur</option>
            <option value="Solapur">Solapur</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Produce Section -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-emerald-950 flex items-center gap-2">
        🛒 Marketplace Listings
      </h2>
      <span id="productCount" class="bg-emerald-100 text-emerald-800 font-bold text-xs px-3 py-1 rounded-full border border-emerald-200">
        Loading...
      </span>
    </div>

    <!-- Crops Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Dynamic Products Will Load Here -->
    </div>
  </main>

  <script>
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (err) {
        console.error(err);
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      const countBadge = document.getElementById('productCount');
      
      grid.innerHTML = '';
      countBadge.innerText = `${products.length} Crops Found`;

      if(products.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-slate-500 text-center py-12 font-semibold">No crops match your search/filter.</p>`;
        return;
      }

      products.forEach(p => {
        const imageUrl = (p.image && p.image.length > 20) 
          ? p.image 
          : 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500';

        // Default mobile number if not provided
        const farmerPhone = p.phone || '919876543210';
        const waMessage = encodeURIComponent(`Hi, I am interested in buying your crop "${p.title}" listed on Agri-Direct for ₹${p.price}/${p.unit}.`);
        const waLink = `https://wa.me/${farmerPhone}?text=${waMessage}`;

        grid.innerHTML += `
          <div class="bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl border border-stone-200/80 transition-all duration-300 flex flex-col justify-between group">
            <div>
              <div class="relative overflow-hidden rounded-2xl mb-4">
                <img src="${imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500'" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500">
                <span class="absolute top-3 right-3 bg-emerald-900/80 backdrop-blur-md text-emerald-200 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">
                  ${p.category || 'Agri'}
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-lg group-hover:text-emerald-700 transition">${p.title}</h3>
              <div class="flex items-baseline gap-1 mt-2">
                <span class="text-2xl font-extrabold text-emerald-600">₹${p.price}</span>
                <span class="text-xs text-slate-400 font-semibold">/ ${p.unit}</span>
              </div>
              <div class="mt-3 pt-3 border-t border-stone-100 flex flex-col gap-1 text-xs text-slate-500">
                <p>📍 District: <b class="text-slate-700">${p.district || 'N/A'}</b></p>
                <p>📦 Quantity: <b class="text-slate-700">${p.quantityAvailable} ${p.unit}</b></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-4">
              <a href="${waLink}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1 shadow-sm transition">
                💬 WhatsApp
              </a>
              <button onclick="orderCrop('${p._id}')" class="bg-emerald-900 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-xs transition">
                🛒 Buy Crop
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedDistrict = document.getElementById('districtFilter').value;

      const filtered = allProducts.filter(p => {
        const matchesName = p.title.toLowerCase().includes(query) || (p.category && p.category.toLowerCase().includes(query));
        const matchesDistrict = selectedDistrict === "" || p.district === selectedDistrict;
        return matchesName && matchesDistrict;
      });

      renderProducts(filtered);
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    loadProducts();
  </script>
</body>
</html>
