<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Agri-Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">

  <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="dashboard.html" class="flex items-center gap-2 font-extrabold text-lg text-emerald-100">
        🌱 Agri-Direct
      </a>
      <a href="dashboard.html" class="bg-emerald-800 hover:bg-emerald-700 text-xs font-semibold px-3 py-2 rounded-xl transition">
        ← Back to Marketplace
      </a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 sm:p-6 my-6">
    <!-- Profile Card -->
    <div class="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm mb-8 flex items-center gap-4">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-800 text-2xl font-bold rounded-2xl flex items-center justify-center">
        👨‍🌾
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800" id="userName">Farmer Profile</h2>
        <p class="text-xs text-slate-500" id="userPhone">Phone: N/A</p>
        <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md mt-1 inline-block">VERIFIED FARMER</span>
      </div>
    </div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.name) document.getElementById('userName').innerText = user.name;
    if(user.phone) document.getElementById('userPhone').innerText = `Phone: +91 ${user.phone}`;
  </script>
</body>
</html>
