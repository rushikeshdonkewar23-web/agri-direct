<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri-Direct | Admin User Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white p-6 rounded-3xl shadow-xl flex flex-wrap justify-between items-center gap-4 mb-8 border border-slate-700/50">
      <div>
        <h1 class="text-2xl font-black tracking-tight flex items-center gap-2">
          🛡️ Owner & Admin Panel
        </h1>
        <p class="text-xs text-emerald-400 font-semibold mt-1">Manage registered farmers and buyers across Agri-Direct</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-1.5">
          ← Go to Dashboard
        </a>
        <button onclick="adminLogout()" class="bg-rose-600 hover:bg-rose-700 text-white font-extrabold px-3.5 py-2.5 rounded-xl text-xs transition">
          🚪 Logout
        </button>
      </div>
    </div>

    <!-- Search Bar & Stats Header -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
      <div class="relative w-full sm:w-80">
        <input type="text" id="userSearchInput" oninput="filterUsers()" placeholder="🔍 Search by name, email or district..." class="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
      </div>
      <span id="userCountBadge" class="bg-emerald-100 text-emerald-900 font-black text-xs px-4 py-2 rounded-full border border-emerald-200 shadow-sm self-end sm:self-auto">
        Loading users...
      </span>
    </div>

    <!-- Users Table Container -->
    <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-black text-slate-500 uppercase tracking-wider">
            <tr>
              <th class="p-4">User Details</th>
              <th class="p-4">Contact Info</th>
              <th class="p-4">Role & District</th>
              <th class="p-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="usersTableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="p-8 text-center text-slate-400 font-semibold">⏳ Loading registered users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];

    // 1. Admin Security Guard (सुरक्षा तपासणी)
    function checkAdminAuth() {
      const isAdmin = localStorage.getItem('isAdmin');
      if (isAdmin !== 'true') {
        alert("🔒 Unauthorized Access! Please login as Admin first.");
        window.location.href = 'admin.html';
      }
    }

    // 2. Fetch Users from Database
    async function fetchUsers() {
      try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) throw new Error("Server response error");
        
        allUsers = await res.json();
        renderUsers(allUsers);
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById('usersTableBody').innerHTML = `
          <tr><td colspan="4" class="p-8 text-center text-rose-500 font-bold">❌ Failed to load users from backend server.</td></tr>
        `;
      }
    }

    // 3. Render Users Table
    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      const countBadge = document.getElementById('userCountBadge');
      tbody.innerHTML = '';

      if (!users || users.length === 0) {
        countBadge.innerText = '0 Users Found';
        tbody.innerHTML = `
          <tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold">No registered users found.</td></tr>
        `;
        return;
      }

      countBadge.innerText = `${users.length} Registered Users`;

      users.forEach(u => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="p-4">
              <p class="font-extrabold text-slate-800 text-sm">${u.name || 'Unnamed User'}</p>
              <p class="text-[10px] font-mono text-slate-400 mt-0.5">ID: ${u._id}</p>
            </td>
            <td class="p-4">
              <p class="text-xs text-slate-700 font-bold">📧 ${u.email || 'N/A'}</p>
              <p class="text-xs text-slate-500 mt-0.5">📞 ${u.phone || 'N/A'}</p>
            </td>
            <td class="p-4">
              <span class="bg-emerald-50 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded-lg uppercase border border-emerald-200/60 inline-block">
                ${u.role || 'FARMER/BUYER'}
              </span>
              <p class="text-xs text-slate-500 font-medium mt-1">📍 ${u.district || 'Maharashtra'}</p>
            </td>
            <td class="p-4 text-center">
              <button onclick="deleteUser('${u._id}', '${(u.name || 'User').replace(/'/g, "\\'")}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-extrabold px-3 py-1.5 rounded-xl text-xs transition active:scale-95">
                🗑️ Delete User
              </button>
            </td>
          </tr>
        `;
      });
    }

    // 4. Live Search Filter
    function filterUsers() {
      const query = document.getElementById('userSearchInput').value.toLowerCase().trim();
      const filtered = allUsers.filter(u => {
        const nameMatch = u.name && u.name.toLowerCase().includes(query);
        const emailMatch = u.email && u.email.toLowerCase().includes(query);
        const districtMatch = u.district && u.district.toLowerCase().includes(query);
        return nameMatch || emailMatch || districtMatch;
      });
      renderUsers(filtered);
    }

    // 5. Delete User Function
    async function deleteUser(userId, userName) {
      if (!confirm(`Are you sure you want to permanently remove "${userName}"?`)) return;

      try {
        const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
        if (res.ok) {
          alert('🗑️ User removed successfully!');
          fetchUsers(); // Refresh list
        } else {
          const data = await res.json();
          alert(data.message || 'Failed to delete user!');
        }
      } catch (err) {
        console.error(err);
        alert('Server Error during user deletion!');
      }
    }

    // 6. Logout Admin
    function adminLogout() {
      localStorage.removeItem('isAdmin');
      window.location.href = 'admin.html';
    }

    // Init Logic
    checkAdminAuth();
    fetchUsers();
  </script>
</body>
</html>
