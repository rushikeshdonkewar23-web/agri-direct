<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Agri-Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">

  <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="dashboard.html" class="flex items-center gap-2 font-extrabold text-lg text-emerald-100">
        🌱 Agri-Direct
      </a>
      <a href="dashboard.html" class="bg-emerald-800 hover:bg-emerald-700 text-xs font-semibold px-3 py-2 rounded-xl transition">
        ← Back to Marketplace
      </a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 sm:p-6 my-6">
    <h2 class="text-2xl font-extrabold text-slate-800 mb-6 flex items-center gap-2">
      📦 Placed Orders
    </h2>

    <div id="ordersList" class="space-y-4">
      <p class="text-slate-500 text-sm">Loading orders...</p>
    </div>
  </main>

  <script>
    async function loadOrders() {
      const token = localStorage.getItem('token');
      const list = document.getElementById('ordersList');

      try {
        const res = await fetch('/api/orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const orders = await res.json();

        if (!orders || orders.length === 0) {
          list.innerHTML = `<div class="bg-white p-8 rounded-3xl text-center border border-stone-200 text-slate-500 font-semibold">No orders found yet.</div>`;
          return;
        }

        list.innerHTML = '';
        orders.forEach(o => {
          list.innerHTML += `
            <div class="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
              <div>
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">Order #${o._id ? o._id.slice(-6) : 'CONFIRMED'}</span>
                <h3 class="font-bold text-slate-800 mt-2 text-base">Buyer: ${o.buyerName || 'N/A'}</h3>
                <p class="text-xs text-slate-500">📞 Phone: <b class="text-slate-700">${o.buyerPhone || 'N/A'}</b></p>
                <p class="text-xs text-slate-500">📦 Quantity: <b class="text-slate-700">${o.quantity}</b></p>
              </div>
              <div class="text-right">
                <span class="bg-green-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl inline-block">Order Placed</span>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="bg-white p-8 rounded-3xl text-center border border-stone-200 text-slate-500">Failed to load orders.</div>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
