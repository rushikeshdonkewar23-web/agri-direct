<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Crop | Agri-Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="dashboard.html" class="flex items-center gap-2 font-extrabold text-lg text-emerald-100">
        🌱 Agri-Direct
      </a>
      <a href="dashboard.html" class="bg-emerald-800 hover:bg-emerald-700 text-xs font-semibold px-3 py-2 rounded-xl transition">
        ← Back to Marketplace
      </a>
    </div>
  </nav>

  <main class="max-w-xl mx-auto p-4 sm:p-6 my-8">
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-stone-200">
      <h2 class="text-2xl font-extrabold text-slate-800 mb-1">✨ List Your Crop</h2>
      <p class="text-xs text-slate-500 mb-6">Add produce details to sell directly to buyers.</p>

      <form id="addCropForm" onsubmit="handleAddCrop(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Crop Title / पिकाचे नाव</label>
          <input type="text" id="title" required placeholder="e.g. Fresh Red Tomato" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Category / प्रकार</label>
            <select id="category" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="Vegetables">Vegetables (भाज्या)</option>
              <option value="Soyabean">Soyabean (सोयाबीन)</option>
              <option value="Cotton">Cotton (कापूस)</option>
              <option value="Fruits">Fruits (फळे)</option>
              <option value="Halad">Halad (हळद)</option>
              <option value="Grains">Grains (धान्य)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">District / जिल्हा</label>
            <select id="district" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="Nanded">Nanded</option>
              <option value="Nashik">Nashik</option>
              <option value="Yavatmal">Yavatmal</option>
              <option value="Sangli">Sangli</option>
              <option value="Latur">Latur</option>
              <option value="Solapur">Solapur</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Price / दर (₹)</label>
            <input type="number" id="price" required placeholder="e.g. 50" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Unit / एकक</label>
            <select id="unit" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="kg">kg</option>
              <option value="Quintal">Quintal</option>
              <option value="Ton">Ton</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Stock Quantity</label>
            <input type="number" id="quantityAvailable" required placeholder="e.g. 500" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Contact Phone</label>
            <input type="tel" id="phone" required placeholder="10-digit number" class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Image URL (Optional)</label>
          <input type="url" id="image" placeholder="https://..." class="w-full border border-stone-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg mt-4">
          Publish Crop Listing 🚀
        </button>
      </form>
    </div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(user.phone) document.getElementById('phone').value = user.phone;

    async function handleAddCrop(e) {
      e.preventDefault();
      const token = localStorage.getItem('token');

      const cropData = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        district: document.getElementById('district').value,
        price: Number(document.getElementById('price').value),
        unit: document.getElementById('unit').value,
        quantityAvailable: Number(document.getElementById('quantityAvailable').value),
        phone: document.getElementById('phone').value,
        image: document.getElementById('image').value
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(cropData)
        });

        if (res.ok) {
          alert('🎉 Crop added successfully!');
          window.location.href = 'dashboard.html';
        } else {
          const err = await res.json();
          alert(err.message || 'Failed to add crop');
        }
      } catch (err) {
        console.error(err);
        alert('Server Error');
      }
    }
  </script>
</body>
</html>
