<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Crop | Agri-Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Nav -->
  <nav class="bg-emerald-900 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="dashboard.html" class="text-xl font-black flex items-center gap-2">🌱 Agri-Direct</a>
      <a href="dashboard.html" class="bg-emerald-800 hover:bg-emerald-700 text-xs font-bold px-4 py-2 rounded-xl transition">
        ⬅️ Back to Dashboard
      </a>
    </div>
  </nav>

  <!-- Form Container -->
  <main class="max-w-xl mx-auto px-4 py-10 w-full">
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-stone-200">
      <h2 class="text-2xl font-black text-slate-800 mb-2">✨ Add New Crop Listing</h2>
      <p class="text-xs text-slate-500 font-semibold mb-6">शेतकरी बंधूंनो, तुमच्या पिकाची माहिती आणि फोटो खाली भरा.</p>

      <form id="cropForm" onsubmit="handleCropSubmit(event)" class="flex flex-col gap-4">
        
        <!-- Image Preview & Input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">Crop Photo / पिकाचा फोटो</label>
          <div class="border-2 border-dashed border-stone-300 rounded-2xl p-4 text-center cursor-pointer hover:border-emerald-500 transition relative bg-stone-50">
            <img id="imagePreview" src="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500" class="w-full h-44 object-cover rounded-xl mb-2">
            <input type="file" id="imageInput" accept="image/*" onchange="compressAndPreviewImage(event)" class="absolute inset-0 opacity-0 cursor-pointer">
            <p class="text-xs text-emerald-700 font-bold">📷 Click to upload/change photo</p>
          </div>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Crop Title / पिकाचे नाव</label>
          <input type="text" id="title" required placeholder="e.g. Fresh Tomatoes / बटाटा" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <!-- Category & District -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Category / प्रकार</label>
            <select id="category" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="Vegetables">Vegetables (भाज्या)</option>
              <option value="Fruits">Fruits (फळे)</option>
              <option value="Soyabean">Soyabean (सोयाबीन)</option>
              <option value="Cotton">Cotton (कापूस)</option>
              <option value="Halad">Halad (हळद)</option>
              <option value="Grains">Grains (धान्य)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">District / जिल्हा</label>
            <select id="district" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="Nanded">Nanded</option>
              <option value="Nashik">Nashik</option>
              <option value="Yavatmal">Yavatmal</option>
              <option value="Sangli">Sangli</option>
              <option value="Latur">Latur</option>
              <option value="Solapur">Solapur</option>
            </select>
          </div>
        </div>

        <!-- Price & Unit -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Price / दर (₹)</label>
            <input type="number" id="price" required placeholder="e.g. 40" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Unit / एकक</label>
            <select id="unit" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="kg">kg</option>
              <option value="Quintal">Quintal</option>
              <option value="Ton">Ton</option>
            </select>
          </div>
        </div>

        <!-- Quantity & Phone -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Stock Quantity</label>
            <input type="number" id="quantityAvailable" required placeholder="e.g. 500" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Contact Phone</label>
            <input type="tel" id="phone" required placeholder="10-digit mobile" class="w-full border border-stone-300 rounded-xl p-3 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg transition mt-4">
          Publish Crop Listing 🚀
        </button>

      </form>
    </div>
  </main>

  <script>
    let base64Image = '';

    // Automatically Compress Uploaded Image
    function compressAndPreviewImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const maxWidth = 600; // Resize image width
          const scaleSize = maxWidth / img.width;
          canvas.width = maxWidth;
          canvas.height = img.height * scaleSize;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Compress JPEG Quality to 0.6
          base64Image = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('imagePreview').src = base64Image;
        };
      };
    }

    // Submit Crop
    async function handleCropSubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'Publishing...';
      submitBtn.disabled = true;

      const payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        district: document.getElementById('district').value,
        price: Number(document.getElementById('price').value),
        unit: document.getElementById('unit').value,
        quantityAvailable: Number(document.getElementById('quantityAvailable').value),
        phone: document.getElementById('phone').value,
        image: base64Image || 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500'
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          alert('🎉 Crop published successfully!');
          window.location.href = 'dashboard.html';
        } else {
          alert(data.message || 'Failed to publish crop');
          submitBtn.innerText = 'Publish Crop Listing 🚀';
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Server Error during publication');
        submitBtn.innerText = 'Publish Crop Listing 🚀';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
